schema_version = 1
platforms = ["android"]

[app]
name = "Stream Tube"
identifier = "io.github.shiroksh.streamtube"
version = "0.1.0"
display_version = "0.1.0"

[app.window]
orientation = "automatic"
theme = "dark"

[android]
min_sdk = 26
target_sdk = "36"
abis = ["arm64-v8a", "x86_64"]

[capabilities.network]
mode = "required"
probe_url = "https://www.youtube.com/"

[capabilities.storage]
enabled = true
