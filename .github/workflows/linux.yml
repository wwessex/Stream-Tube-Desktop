name: Linux build

on:
  push:
    branches: [main]
    paths: ["src/**", "Cargo.toml", "Cargo.lock", "build.rs", "packaging/linux/**", ".github/workflows/linux.yml"]
  # every pull request is built and its packages checked (no path filter, so the
  # required check always reports)
  pull_request:
  workflow_dispatch:
  # release.yml builds the release packages with this
  workflow_call:

permissions:
  contents: read

jobs:
  linux:
    # the oldest supported Ubuntu keeps the binary compatible with older glibc
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config cmake clang \
            libfontconfig1-dev libfreetype-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-dev libx11-xcb-dev libxcb1-dev libxcb-xkb-dev libvulkan-dev libssl-dev libzstd-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked

      - name: Package
        id: pkg
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          name="StreamTube-${version}-linux-x86_64"
          mkdir -p "dist/$name"
          cp target/release/streamtube "dist/$name/"
          strip "dist/$name/streamtube"
          cp packaging/linux/streamtube.desktop packaging/linux/install.sh "dist/$name/"
          chmod +x "dist/$name/install.sh"
          cp assets/logo.png "dist/$name/streamtube.png"
          cp LICENSE README.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          echo "file=dist/$name.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Build .deb and .rpm
        id: native
        run: |
          sudo apt-get install -y --no-install-recommends ruby ruby-dev rpm dpkg-dev
          sudo gem install --no-document fpm
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          # "0.2.0-alpha" -> "0.2.0~alpha", which both dpkg and rpm sort before "0.2.0"
          pkgver=$(echo "$version" | sed 's/-/~/')

          root=pkgroot
          install -Dm755 target/release/streamtube "$root/usr/bin/streamtube"
          strip "$root/usr/bin/streamtube"
          install -Dm644 packaging/linux/streamtube.desktop "$root/usr/share/applications/streamtube.desktop"
          install -Dm644 assets/logo.png "$root/usr/share/icons/hicolor/256x256/apps/streamtube.png"
          install -Dm644 assets/logo.svg "$root/usr/share/icons/hicolor/scalable/apps/streamtube.svg"
          install -Dm644 packaging/linux/io.github.avaneesh_inamdar.StreamTube.metainfo.xml "$root/usr/share/metainfo/io.github.avaneesh_inamdar.StreamTube.metainfo.xml"
          install -Dm644 LICENSE "$root/usr/share/doc/streamtube/LICENSE"
          install -Dm644 README.md "$root/usr/share/doc/streamtube/README.md"

          # shared libraries the binary links against, as Debian package names
          mkdir -p debian && echo "Source: streamtube" > debian/control
          shlibs=$(dpkg-shlibdeps -O "$root/usr/bin/streamtube" 2>/dev/null | sed -n 's/^shlibs:Depends=//p')
          echo "linked libraries: $shlibs"
          rm -rf debian

          common=(
            -s dir -C "$root" -n streamtube -v "$pkgver" -a x86_64
            --license MIT --url "https://github.com/Avaneesh-Inamdar/Stream-Tube-Desktop"
            --maintainer "Stream Tube <noreply@github.com>"
            --description "Stream Tube - a fast native YouTube client with SponsorBlock, DeArrow and Return YouTube Dislike"
            --category video
            --after-install packaging/linux/postinst.sh --after-remove packaging/linux/postinst.sh
          )

          # video plays through libmpv, loaded at runtime
          deb_deps=()
          IFS=',' read -ra parts <<< "$shlibs"
          for d in "${parts[@]}"; do d=$(echo "$d" | xargs); [ -n "$d" ] && deb_deps+=(--depends "$d"); done
          fpm "${common[@]}" -t deb -p dist/ "${deb_deps[@]}" --depends "libmpv2 | libmpv1" --deb-recommends yt-dlp --deb-recommends ffmpeg usr

          mpv_rpm_dep='(libmpv.so.2()(64bit) or libmpv.so.1()(64bit))'
          fpm "${common[@]}" -t rpm -p dist/ --rpm-autoreqprov --depends "$mpv_rpm_dep" usr

          # GitHub turns "~" in asset names into "."; the file names use the plain
          # version, the package metadata keeps "~" so upgrades sort correctly
          # (a plain release already has the right .deb name; mv refuses same-file moves)
          for f in dist/*.deb; do [ "$f" = "dist/streamtube_${version}_amd64.deb" ] || mv "$f" "dist/streamtube_${version}_amd64.deb"; done
          for f in dist/*.rpm; do [ "$f" = "dist/streamtube-${version}.x86_64.rpm" ] || mv "$f" "dist/streamtube-${version}.x86_64.rpm"; done
          ls -l dist
          deb=$(ls dist/*.deb); rpm=$(ls dist/*.rpm)
          dpkg-deb --info "$deb"
          rpm_requires=$(rpm -qpR "$rpm")
          printf '%s\n' "$rpm_requires"
          grep -Fqx -- "$mpv_rpm_dep" <<< "$rpm_requires"
          echo "deb=$deb" >> "$GITHUB_OUTPUT"
          echo "rpm=$rpm" >> "$GITHUB_OUTPUT"

      # The AppImage bundles its own media stack so video plays on any
      # distribution without installing anything. Ubuntu 22.04's libmpv1
      # (mpv 0.34 / FFmpeg 4.4) freezes any seek past the demuxer cache on
      # HLS fMP4 streams (#178), so a current FFmpeg and libmpv are built
      # from source instead, linked against the old runner's glibc so the
      # AppImage still runs everywhere. FFmpeg is pinned to 9.1 on purpose:
      # deep seeks into YouTube's fMP4 HLS VODs still fail outright on 7.1
      # and freeze on 4.4, and work on 9.1 (verified against a real
      # stream). At runtime the app also prefers a newer system
      # libmpv.so.2 (src/player/mpv.rs); this stack is the bundled fallback.
      - name: Build libmpv for the AppImage
        run: |
          sudo apt-get install -y --no-install-recommends \
            nasm ninja-build pkg-config python3-pip python3-jinja2 file \
            libssl-dev libass-dev \
            libpulse-dev libasound2-dev libva-dev libvdpau-dev
          # mpv 0.42 needs libplacebo >= 7.387 (which needs meson >= 1.3);
          # Ubuntu 22.04 ships neither (libplacebo 4.x, meson 0.61)
          sudo pip3 install meson

          curl -sSLO https://ffmpeg.org/releases/ffmpeg-9.1.tar.xz
          curl -sSLo libplacebo-7.387.0.tar.gz https://github.com/haasn/libplacebo/archive/refs/tags/v7.387.0.tar.gz
          curl -sSLo mpv-0.42.0.tar.gz https://github.com/mpv-player/mpv/archive/refs/tags/v0.42.0.tar.gz
          cat > SHA256SUMS <<'EOF'
          1a4d394ae63d190a526cd052eb4415c156b5c5e2df37efab41a7de0b8fde2433  ffmpeg-9.1.tar.xz
          f9e62d3774a9c4cfd198ec3abaa88294aaade2e31c04d5ab02bcf4abc98b1df5  libplacebo-7.387.0.tar.gz
          bcfebbfa2b65a6d88dc97ea18117831072373e38b5785a2afb874ed4df5070dd  mpv-0.42.0.tar.gz
          EOF
          sha256sum -c SHA256SUMS

          # NVDEC/CUVID headers, the ones FFmpeg's own builds use: lets the
          # bundled libmpv keep hardware decoding on NVIDIA GPUs. Header-only,
          # so the driver on the user's machine still provides the libraries.
          git clone -q --depth 1 --branch n12.2.72.0 https://github.com/FFmpeg/nv-codec-headers.git
          sudo make -C nv-codec-headers install PREFIX=/usr/local

          export PKG_CONFIG_PATH=/usr/local/lib/pkgconfig

          # Ubuntu 22.04 ships libdav1d 0.9.2, while FFmpeg 9.1 requires >= 1.0.0.
          git clone -q --depth 1 --branch 1.5.1 https://code.videolan.org/videolan/dav1d.git
          meson setup dav1d/build dav1d --buildtype release -Dprefix=/usr/local -Dlibdir=lib \
            -Denable_tools=false -Denable_tests=false -Denable_examples=false
          ninja -C dav1d/build
          sudo ninja -C dav1d/build install
          sudo ldconfig

          # FFmpeg with all its internal codecs/demuxers/filters (VP9, H.264,
          # HEVC, Opus, AAC, HLS, fMP4, MPEG-TS, ...) plus dav1d for AV1 and
          # openssl for https; vaapi/vdpau/nvdec are picked up from the dev
          # packages above
          tar -xJf ffmpeg-9.1.tar.xz
          cd ffmpeg-9.1
          ./configure --prefix=/usr/local --libdir=/usr/local/lib \
            --enable-shared --disable-static --disable-programs --disable-doc \
            --enable-gpl --enable-version3 --enable-openssl --enable-libdav1d
          make -j"$(nproc)"
          sudo make install
          sudo ldconfig
          cd ..

          # libmpv renders through the software render API: libplacebo needs
          # no GPU backend here, which also skips its Vulkan/shader deps
          tar -xzf libplacebo-7.387.0.tar.gz
          cd libplacebo-7.387.0
          meson setup build --buildtype release -Dprefix=/usr/local -Dlibdir=lib \
            -Dvulkan=disabled -Dopengl=disabled -Ddemos=false -Dtests=false
          ninja -C build
          sudo ninja -C build install
          sudo ldconfig
          cd ..

          tar -xzf mpv-0.42.0.tar.gz
          cd mpv-0.42.0
          meson setup build --buildtype release -Dprefix=/usr/local -Dlibdir=lib \
            -Dlibmpv=true -Dcplayer=false -Dvulkan=disabled \
            -Dlua=disabled -Djavascript=disabled \
            -Dmanpage-build=disabled -Dhtml-build=disabled \
            -Dlibarchive=disabled -Duchardet=disabled
          ninja -C build
          sudo ninja -C build install
          sudo ldconfig
          cd ..
          ls -l /usr/local/lib/libmpv.so.2

      - name: Build AppImage
        id: appimage
        run: |
          # libmpv (and everything it links against) goes inside, so the AppImage
          # plays video on any distribution without installing anything
          sudo apt-get install -y --no-install-recommends file desktop-file-utils appstream
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          out="dist/StreamTube-${version}-x86_64.AppImage"
          wget -q -O linuxdeploy https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy

          app=AppDir
          install -Dm755 target/release/streamtube "$app/usr/bin/streamtube"
          strip "$app/usr/bin/streamtube"
          # inside the AppImage the desktop entry and metadata are named after the app id
          cid=io.github.avaneesh_inamdar.StreamTube
          install -Dm644 packaging/linux/streamtube.desktop "$app/usr/share/applications/$cid.desktop"
          install -Dm644 assets/logo.png "$app/usr/share/icons/hicolor/256x256/apps/streamtube.png"
          install -Dm644 assets/logo.svg "$app/usr/share/icons/hicolor/scalable/apps/streamtube.svg"
          install -Dm644 LICENSE "$app/usr/share/doc/streamtube/LICENSE"
          mkdir -p "$app/usr/share/metainfo"
          sed "s|>streamtube.desktop<|>$cid.desktop<|" "packaging/linux/$cid.metainfo.xml" > "$app/usr/share/metainfo/$cid.metainfo.xml"
          desktop-file-validate "$app/usr/share/applications/$cid.desktop" || true
          appstreamcli validate --no-net "$app/usr/share/metainfo/$cid.metainfo.xml" || true

          mpv=/usr/local/lib/libmpv.so.2
          echo "bundling $mpv"
          # no FUSE on the runner: let the tool unpack itself
          export APPIMAGE_EXTRACT_AND_RUN=1 ARCH=x86_64 LDAI_OUTPUT="$out"
          ./linuxdeploy --appdir "$app" --library "$mpv" --output appimage

          # libmpv and its libraries are inside, and nothing it needs is missing
          ls "$app/usr/lib" | grep -E '^libmpv\.so'
          if LD_LIBRARY_PATH="$app/usr/lib" ldd "$app/usr/lib/$(basename "$mpv")" | grep "not found"; then
            echo "libmpv is missing libraries"; exit 1
          fi
          chmod +x "$out"
          ls -l "$out"
          echo "file=$out" >> "$GITHUB_OUTPUT"

      - name: Check the .deb installs
        run: |
          sudo apt-get install -y "./${{ steps.native.outputs.deb }}"
          test -x /usr/bin/streamtube
          ls /usr/share/applications/streamtube.desktop

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: |
            ${{ steps.pkg.outputs.file }}
            ${{ steps.native.outputs.deb }}
            ${{ steps.native.outputs.rpm }}
            ${{ steps.appimage.outputs.file }}
          if-no-files-found: error

